[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tomo"
version = "0.1.0"
description = "TOMO — the electric pet that lives in your repos and judges your code (affectionately)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0",
    "typer>=0.12",
    "gitpython>=3.1",
    "pydantic>=2.0",
]

[project.scripts]
tomo = "tomo.main:app"

[tool.setuptools.packages.find]
where = ["src"]
